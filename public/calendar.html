<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>病房行事曆與活動行程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* 晨會行事曆 — modelled on the printed 排程表 it replaces:
       a date column on the left, the entry to its right, ruled throughout. */

    .directory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
    }

    .btn-add {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-add:active { background: var(--paper-sunken); }

    .events-timeline {
      display: block;
      border-top: 2px solid var(--ink);
    }

    .date-group { display: block; }

    /* The date heading is the ruled row that starts a block on the sheet */
    .date-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: var(--paper-sunken);
      padding: 7px 10px;
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .date-heading-day {
      color: var(--ink-faint);
      font-size: 11px;
    }

    .event-card {
      position: relative;
      padding: 12px 10px 12px 14px;
      border-bottom: 1px solid var(--rule);
      border-left: 3px solid transparent;
      background: transparent;
      margin-bottom: 0 !important;
    }

    /* Entry type is carried by the left edge, the way a form is tabbed */
    .event-card.presentation { border-left-color: var(--stamp); }
    .event-card.meeting-exclusion { border-left-color: var(--rule-strong); }
    .event-card.meeting-exclusion .event-title { color: var(--ink-faint); }

    .event-card.by-machine { border-left-color: var(--pen); }
    .event-card.by-machine .event-title { color: var(--pen); }

    .event-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
      padding-right: 34px;
      line-height: 1.5;
    }

    .event-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      margin-top: 5px;
    }

    .event-time { color: var(--ink-soft); font-weight: 500; }

    .event-description {
      font-size: 13px;
      line-height: 1.75;
      color: var(--ink-soft);
      margin-top: 7px;
      padding-left: 11px;
      border-left: 1px solid var(--rule);
    }

    .event-card-actions {
      position: absolute;
      top: 11px;
      right: 8px;
      display: flex;
      gap: 4px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink-faint);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active { border-color: var(--alert); color: var(--alert); }

    /* ---------- Modal ---------- */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--paper-raised);
      border: 1px solid var(--rule-strong);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      transform: translateY(16px);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .modal-overlay.show .modal-card { transform: translateY(0); }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 18px;
    }

    .input-field {
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 11px 12px;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--pen);
      box-shadow: 0 0 0 3px var(--pen-wash);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
    }

    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid var(--rule-strong);
      color: var(--ink-soft);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save-confirm {
      flex: 2;
      background: var(--stamp);
      border: 1px solid var(--stamp);
      color: #fff;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .btn-save-confirm:active { background: transparent; color: var(--stamp); }
  </style>
</head>
<body>
  <div class="liff-container">
    <!-- User Badge -->
    <div class="user-badge" id="user-badge" style="display: none;">
      <img class="user-avatar" id="user-avatar" src="" alt="avatar">
      <span id="user-name">載入同仁資料中...</span>
    </div>

    <!-- Header Section -->
    <div class="header">
      <div class="header-icon purple">📅</div>
      <h1>病房行事曆與活動行程</h1>
      <p>管理晨會報告排程與病房各項科內活動行程</p>
      <div class="meta-info" id="meta-info">連線中...</div>
    </div>

    <!-- Directory Header & Add Button -->
    <div class="directory-header">
      <span style="font-size: 14px; font-weight: 600; color: var(--text-secondary);">行程活動列表</span>
      <button class="btn-add" onclick="openAddModal()">
        <span>＋</span> 手動新增行程
      </button>
    </div>

    <!-- Events Timeline -->
    <div class="events-timeline" id="events-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
        正在載入病房行程中...
      </div>
    </div>

    <!-- Close button -->
    <button class="btn-secondary" style="padding: 12px;" onclick="closeLiff()">
      ✕ 關閉行事曆
    </button>
  </div>

  <!-- Add Event Modal Overlay -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-card">
      <div class="modal-title">
        <span>✏️</span> 新增行程活動
      </div>
      
      <div class="form-group">
        <label class="form-label" style="font-size: 12px;">行程標題</label>
        <input type="text" class="input-field" id="input-title" placeholder="例如：晨會個案報告、全科聚餐">
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 0;">
        <div class="form-group" style="flex: 1.5;">
          <label class="form-label" style="font-size: 12px;">日期</label>
          <input type="date" class="input-field" id="input-date">
        </div>
        <div class="form-group" style="flex: 1;">
          <label class="form-label" style="font-size: 12px;">時間 (選填)</label>
          <input type="time" class="input-field" id="input-time">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" style="font-size: 12px;">地點 (選填)</label>
        <input type="text" class="input-field" id="input-location" placeholder="例如：第二會議室">
      </div>

      <div class="form-group">
        <label class="form-label" style="font-size: 12px;">詳細備註 (選填)</label>
        <input type="text" class="input-field" id="input-description" placeholder="例如：陳醫師報告 URO 案例">
      </div>
      
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save-confirm" id="btn-save-confirm" onclick="saveEventSubmit()">確認儲存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast-notify">
    <div class="toast-icon" id="toast-icon"></div>
    <span id="toast-text">更新成功！</span>
  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let userName = '未知同仁';
    let userAvatarUrl = '';
    let groupId = 'C9f983c75e05c479be325b749e4c30004'; // Default fallback

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast-notify');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');
      
      text.innerText = message;
      if (isError) {
        icon.className = 'toast-icon error';
      } else {
        icon.className = 'toast-icon';
      }
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function parseGroupId() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryGroupId = urlParams.get('groupId');
      if (queryGroupId) {
        groupId = queryGroupId;
      }
      try {
        if (liff && liff.getContext() && liff.getContext().groupId) {
          groupId = liff.getContext().groupId;
        }
      } catch (e) {
        console.log("No LIFF group context", e);
      }
    }

    // Modal Control
    function openAddModal() {
      document.getElementById('input-title').value = '';
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('input-time').value = '08:00';
      document.getElementById('input-location').value = '';
      document.getElementById('input-description').value = '';
      document.getElementById('event-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('event-modal').classList.remove('show');
    }

    // Initialize LIFF
    async function initLiff() {
      try {
        const resConfig = await fetch('/api/config');
        const config = await resConfig.json();
        
        await liff.init({ liffId: config.LIFF_CALENDAR_ID });

        if (liff.isLoggedIn()) window.__setIdToken(liff.getIDToken());
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userName = profile.displayName;
          userAvatarUrl = profile.pictureUrl;
          
          document.getElementById('user-name').innerText = userName;
          if (userAvatarUrl) {
            document.getElementById('user-avatar').src = userAvatarUrl;
          }
          document.getElementById('user-badge').style.display = 'flex';

          // Sync user
          await fetch('/api/users/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lineUserId: profile.userId, displayName: userName })
          });
        } else {
          console.warn("LINE LIFF not logged in.");
          userName = "臨床同仁";
          document.getElementById('user-name').innerText = userName;
          document.getElementById('user-badge').style.display = 'flex';
        }
        
        parseGroupId();
        await fetchEventsList();
      } catch (err) {
        console.error('LIFF initialization failed', err);
        document.getElementById('meta-info').innerText = '行事曆連線成功';
        parseGroupId();
        await fetchEventsList();
      }
    }

    // Fetch Events List
    async function fetchEventsList() {
      try {
        const response = await fetch(`/api/events?groupId=${groupId}`);
        if (response.ok) {
          const events = await response.json();
          renderEventsList(events);
        } else {
          document.getElementById('events-list').innerHTML = '<div style="text-align: center; color: var(--color-rose); padding: 40px;">無法取得行事曆資料</div>';
        }
      } catch (error) {
        document.getElementById('events-list').innerHTML = '<div style="text-align: center; color: var(--color-rose); padding: 40px;">連線異常</div>';
      }
    }

    // Render Events grouped by date
    function renderEventsList(events) {
      const container = document.getElementById('events-list');
      if (events.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--ink-faint); padding: 40px;">目前此群組無排定行程或報告。</div>';
        document.getElementById('meta-info').innerText = '無行程安排';
        return;
      }

      // Group by date
      const grouped = {};
      events.forEach(e => {
        if (!grouped[e.date]) {
          grouped[e.date] = [];
        }
        grouped[e.date].push(e);
      });

      container.innerHTML = '';
      
      // Sort dates
      const sortedDates = Object.keys(grouped).sort((a, b) => a.localeCompare(b));
      
      sortedDates.forEach(dateStr => {
        const dateObj = new Date(dateStr);
        const dayOfWeekStr = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
        
        let dateHtml = `
          <div class="date-group">
            <div class="date-heading"><span class="date-heading-date">${dateStr}</span><span class="date-heading-day">週${dayOfWeekStr}</span></div>
        `;
        
        grouped[dateStr].forEach(event => {
          let cardClass = 'event-card';
          if (event.title.includes('院務會議') || event.title.includes('停開')) {
            cardClass += ' meeting-exclusion';
          } else if (event.title.includes('報告')) {
            cardClass += ' presentation';
          }
          // Entries the AI read off a photograph are pen on the printed sheet.
          if (/^AI/.test(event.created_by || '')) {
            cardClass += ' by-machine';
          }
          
          let metaParts = [];
          if (event.time) {
            metaParts.push(`<span class="event-time">${event.time}</span>`);
          }
          if (event.location) {
            metaParts.push(`<span>${escapeHtml(event.location)}</span>`);
          }
          metaParts.push(`<span>${escapeHtml(event.created_by)}</span>`);
          
          dateHtml += `
            <div class="${cardClass}" style="margin-bottom: 8px;">
              <div class="event-title">${escapeHtml(event.title)}</div>
              <div class="event-meta">
                ${metaParts.join('')}
              </div>
              ${event.description ? `<div class="event-description">${escapeHtml(event.description)}</div>` : ''}
              <div class="event-card-actions">
                <button class="action-btn delete-btn" onclick="deleteEvent('${event.id}')" title="刪除行程" style="width:24px; height:24px; font-size:10px;">🗑️</button>
              </div>
            </div>
          `;
        });
        
        dateHtml += `</div>`;
        container.insertAdjacentHTML('beforeend', dateHtml);
      });

      document.getElementById('meta-info').innerText = `已排定 ${events.length} 筆行程`;
    }

    // Save Event
    async function saveEventSubmit() {
      const title = document.getElementById('input-title').value.trim();
      const date = document.getElementById('input-date').value;
      const time = document.getElementById('input-time').value;
      const location = document.getElementById('input-location').value.trim();
      const description = document.getElementById('input-description').value.trim();
      
      if (!title || !date) {
        showToast('請填寫標題與日期', true);
        return;
      }

      const btn = document.getElementById('btn-save-confirm');
      btn.disabled = true;
      btn.innerText = '儲存中...';

      try {
        const response = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            groupId,
            title,
            date,
            time,
            location,
            description,
            createdBy: userName
          })
        });

        if (response.ok) {
          showToast('行程已成功新增！');
          closeModal();
          await fetchEventsList();
        } else {
          showToast('伺服器處理錯誤', true);
        }
      } catch (error) {
        showToast('連線失敗：' + error.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = '確認儲存';
      }
    }

    // Delete Event
    async function deleteEvent(id) {
      if (confirm('確定要永久刪除此項行程嗎？')) {
        try {
          const response = await fetch(`/api/events/${id}`, {
            method: 'DELETE'
          });
          if (response.ok) {
            showToast('行程已成功刪除！');
            await fetchEventsList();
          } else {
            showToast('無法刪除行程', true);
          }
        } catch (error) {
          showToast('連線失敗：' + error.message, true);
        }
      }
    }

    function closeLiff() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        alert('請在 LINE 內點選以關閉網頁。');
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onload = initLiff;
  </script>
</body>
</html>
