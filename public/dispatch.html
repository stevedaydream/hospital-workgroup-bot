<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日轉發名單審查</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .share-box { margin: 12px 0; display: grid; gap: 6px; }
    .share-box.highlight #btn-share { box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.35); }
    .share-hint { margin: 0; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="liff-container">
    <div class="header">
      <div class="header-icon">🔍</div>
      <h1>今日轉發名單審查</h1>
      <p>請確認這張分配表要給哪些群組，AI 辨識結果已自動預填</p>
    </div>

    <!-- Image Preview from Web Server -->
    <div class="image-preview-box">
      <img id="case-sheet-img" src="" alt="Case Table Image">
      <div class="image-preview-label">本日 Case 分配大表 (OCR 辨識來源)</div>
    </div>

    <div class="share-box" id="share-box">
      <button class="btn-primary" id="btn-share" onclick="shareTable()">📤 分享分配表到群組</button>
      <p class="share-hint">LINE 不允許預先勾選，請在分享畫面搜尋並勾選下列群組，圖片會以你的名義送出，<b>不扣機器人推播額度</b>。你必須是該群組的成員。</p>
      <p class="share-hint" id="share-targets"></p>
    </div>

    <div class="quick-actions">
      <button class="btn-secondary" onclick="toggleAll(true)">✓ 全選</button>
      <button class="btn-secondary" onclick="toggleAll(false)">✗ 取消全選</button>
    </div>

    <div class="doctor-list" id="doctor-list-container">
      <div style="text-align: center; color: var(--text-secondary); padding: 20px;">
        讀取群組資料中...
      </div>
    </div>

    <button class="btn-primary" id="btn-submit" onclick="submitDispatch()">
      <span class="spinner" id="btn-spinner"></span>
      <span id="btn-text">確認轉發名單</span>
    </button>
  </div>

  <div class="toast" id="toast-notify">
    <div class="toast-icon" id="toast-icon"></div>
    <span id="toast-text">設定成功！</span>
  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let userName = '未知同仁';
    let liffParams = {
      msgId: '',
      dept: '',
      sourceId: ''
    };

    // Same rule as nextDispatchDate() on the server: before 07:30 Taiwan time the next run is this morning.
    function dispatchWhen() {
      const [h, m] = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
        .format(new Date()).split(':').map(Number);
      return h * 60 + m < 7 * 60 + 30 ? '今早' : '明早';
    }
    document.querySelectorAll('.dispatch-when').forEach(el => { el.textContent = dispatchWhen(); });

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast-notify');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');
      
      text.innerText = message;
      if (isError) {
        icon.className = 'toast-icon error';
      } else {
        icon.className = 'toast-icon';
      }
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Parse query params from URL
    function parseQueryParams() {
      const urlParams = new URLSearchParams(window.location.search);
      liffParams.msgId = urlParams.get('msgId') || '';
      liffParams.dept = urlParams.get('dept') || '';
      liffParams.sourceId = urlParams.get('sourceId') || '';

      if (!liffParams.msgId) {
        // Mock fallback image for web browser test
        document.getElementById('case-sheet-img').src = 'https://placehold.co/600x400/f6f8f9/66727c?text=Hospital+Case+Table';
      }
    }

    // The photo is only served to logged-in colleagues, so it is fetched with the LIFF token.
    async function loadCaseImage() {
      try {
        const res = await fetch(`/api/images/${encodeURIComponent(liffParams.msgId)}`);
        if (!res.ok) throw new Error(res.status);
        document.getElementById('case-sheet-img').src = URL.createObjectURL(await res.blob());
      } catch (error) {
        console.warn('Case image unavailable', error);
      }
    }

    // Shares the photo as the person tapping (liff.shareTargetPicker), which does
    // not use the bot's push quota. Needs "Share target picker" on for this LIFF app.
    async function shareTable() {
      if (!liffParams.msgId) return showToast('沒有可分享的分配表', true);
      if (!window.liff || !liff.isApiAvailable('shareTargetPicker')) {
        return showToast('請在 LINE 內開啟此頁，或請管理者在 LIFF 設定開啟分享功能', true);
      }
      try {
        const res = await fetch(`/api/images/${encodeURIComponent(liffParams.msgId)}/share-link`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        const result = await liff.shareTargetPicker(
          [{ type: 'image', originalContentUrl: data.url, previewImageUrl: data.url }],
          { isMultiple: true }
        );
        if (result) showToast('已分享分配表');
      } catch (error) {
        showToast('分享失敗：' + error.message, true);
      }
    }

    // Posts into the chat this page was opened from, as the user: free, unlike a bot push.
    async function postToChat(text) {
      try {
        const type = liff.isInClient() && liff.getContext()?.type;
        if (['group', 'room', 'utou'].includes(type)) await liff.sendMessages([{ type: 'text', text }]);
      } catch (error) {
        console.warn('Could not post the confirmation to the chat', error);
      }
    }

    function toggleAll(checked) {
      const checkboxes = document.querySelectorAll('.doctor-checkbox');
      checkboxes.forEach(cb => cb.checked = checked);
      refreshSummary();
    }

    // The switches only choose who this table is for. Groups with auto-push get it from
    // the bot at 07:30; every other chosen group must be shared by hand (LINE cannot
    // pre-select share targets), so the page lists them and labels the button to match.
    function chosenGroups() {
      const seen = new Map();
      document.querySelectorAll('.doctor-checkbox:checked').forEach(cb => {
        seen.set(cb.dataset.groupId, { name: cb.dataset.name, auto: cb.dataset.auto === '1' });
      });
      return [...seen.values()];
    }

    function shareNames() {
      return chosenGroups().filter(g => !g.auto).map(g => g.name);
    }

    function refreshSummary() {
      const groups = chosenGroups();
      const share = shareNames();
      const auto = groups.filter(g => g.auto).map(g => g.name);
      document.getElementById('share-targets').textContent = share.length
        ? `請分享到：${share.join('、')}`
        : '目前沒有需要手動分享的群組。';
      document.getElementById('btn-text').innerText = !groups.length
        ? '確認轉發名單（不傳送給任何群組）'
        : auto.length
          ? `確認轉發名單（${auto.join('、')} 於${dispatchWhen()} 07:30 自動推播）`
          : '確認轉發名單（不會自動發送，確認後請按分享）';
    }

    // Initialize LIFF
    async function initLiff() {
      parseQueryParams();
      
      try {
        const resConfig = await fetch('/api/config');
        const config = await resConfig.json();
        
        await liff.init({ liffId: config.LIFF_DISPATCH_ID });

        if (liff.isLoggedIn()) window.__setIdToken(liff.getIDToken());
        if (liffParams.msgId) loadCaseImage();
        if (new URLSearchParams(location.search).get('share') === '1') {
          document.getElementById('share-box').classList.add('highlight');
        }
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userName = profile.displayName;
        } else {
          console.warn("LINE LIFF not logged in. Running in standalone browser mode.");
        }
        
        await loadDoctorMappings();
      } catch (err) {
        console.error('LIFF initialization failed', err);
        showToast('LIFF 初始化失敗，使用預設瀏覽器載入模式', false);
        await loadDoctorMappings();
      }
    }

    // Fetch ALL mappings and active cache state
    async function loadDoctorMappings() {
      const container = document.getElementById('doctor-list-container');
      try {
        // 1. Fetch ALL doctor group mappings in the hospital DB
        const resMap = await fetch(`/api/doctor-mappings`);
        const mappings = await resMap.json();

        if (mappings.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">無對應醫師群組資料</div>';
          return;
        }

        // 2. Fetch current status from Daily Dispatch Cache (which target groups are in cache)
        const resCache = await fetch(`/api/dispatch-cache?msgId=${liffParams.msgId}`);
        const activeCaches = await resCache.json();
        
        // Active target groups in cache (AI identified or previously saved)
        const activeGroupIds = activeCaches.map(c => c.target_line_group_id);

        container.innerHTML = '';
        
        // Sort mappings so checked ones (AI identified) appear first
        mappings.sort((a, b) => {
          const aChecked = activeGroupIds.includes(a.line_group_id) ? 1 : 0;
          const bChecked = activeGroupIds.includes(b.line_group_id) ? 1 : 0;
          return bChecked - aChecked; // Checked items first
        });

        mappings.forEach(map => {
          // Precheck logic: if it's currently in the daily dispatch cache
          const isChecked = activeGroupIds.includes(map.line_group_id);
          const badgeClass = map.type === 'DIRECT' ? 'type-direct' : 'type-flexible';

          const itemHtml = `
            <div class="doctor-item">
              <div class="doctor-info">
                <span class="doctor-name">
                  ${escapeHtml(map.group_name)}
                  <span class="type-badge ${badgeClass}" style="margin-left: 6px;">${map.type === 'DIRECT' ? '骨科' : '泌尿科'}</span>
                  <span class="type-badge" style="margin-left: 4px;">${map.auto_push ? '07:30 推播' : '手動分享'}</span>
                </span>
                <span class="doctor-group">比對金鑰: ${escapeHtml(map.match_key)}</span>
              </div>
              <label class="switch">
                <input type="checkbox" class="doctor-checkbox" data-group-id="${escapeHtml(map.line_group_id)}" data-name="${escapeHtml(map.group_name)}" data-auto="${map.auto_push ? '1' : '0'}" ${isChecked ? 'checked' : ''}>
                <span class="slider"></span>
              </label>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', itemHtml);
        });
        // Several doctors can map to one group, but the group gets the table once: keep
        // that group's switches in step, or turning one off would drop the whole group.
        container.querySelectorAll('.doctor-checkbox').forEach(cb => cb.addEventListener('change', () => {
          container.querySelectorAll('.doctor-checkbox').forEach(other => {
            if (other.dataset.groupId === cb.dataset.groupId) other.checked = cb.checked;
          });
          refreshSummary();
        }));
        refreshSummary();

      } catch (error) {
        console.error('Failed to load mappings', error);
        container.innerHTML = '<div style="text-align: center; color: var(--color-rose); padding: 20px;">讀取資料失敗</div>';
        showToast('載入對照表失敗', true);
      }
    }

    async function submitDispatch() {
      const checkboxes = document.querySelectorAll('.doctor-checkbox');
      if (!checkboxes.length) {
        showToast('名單尚未載入，請重新開啟此頁', true);
        return;
      }
      const selectedGroups = [];
      const unselectedGroups = [];

      checkboxes.forEach(cb => {
        const groupId = cb.getAttribute('data-group-id');
        if (cb.checked) selectedGroups.push(groupId);
      });
      checkboxes.forEach(cb => {
        const groupId = cb.getAttribute('data-group-id');
        if (!selectedGroups.includes(groupId) && !unselectedGroups.includes(groupId)) unselectedGroups.push(groupId);
      });

      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      
      btnText.innerText = '正在儲存設定...';
      spinner.style.display = 'inline-block';
      document.getElementById('btn-submit').disabled = true;

      try {
        const response = await fetch('/api/dispatch-cache/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messageId: liffParams.msgId,
            selectedGroups,
            unselectedGroups,
            sourceId: liffParams.sourceId,
            updatedBy: userName
          })
        });

        if (response.ok) {
          const data = await response.json().catch(() => ({}));
          if (data.confirmText) await postToChat(data.confirmText);
          const share = shareNames();
          if (share.length) {
            // Keep the page open: the table still has to be shared by hand.
            showToast(`已儲存，請按「分享」傳到：${share.join('、')}`);
            const box = document.getElementById('share-box');
            box.classList.add('highlight');
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            showToast('分流名單更新成功！');
            setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1500);
          }
        } else {
          showToast('伺服器處理錯誤', true);
        }
      } catch (error) {
        showToast('設定失敗：' + error.message, true);
      } finally {
        refreshSummary();
        spinner.style.display = 'none';
        document.getElementById('btn-submit').disabled = false;
      }
    }

    // Escaping helper to avoid XSS
    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onload = initLiff;
  </script>
</body>
</html>
