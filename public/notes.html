<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>病房注意事項管理目錄</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .review-panel { margin: 12px 0 20px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    .review-panel summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
    .review-panel p { margin: 8px 0; line-height: 1.7; }
    .review-item { padding: 16px 0; border-top: 1px solid var(--line); }
    .review-item h3 { font-size: 16px; overflow-wrap: anywhere; }
    .review-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-countdown { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .review-actions button { flex: 1 1 130px; min-height: 44px; padding: 10px 12px; }
    .review-actions button:disabled { opacity: .6; cursor: wait; }
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      animation: cardFadeIn 0.3s var(--ease-out);
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .note-card:hover { border-color: var(--line-strong); background: var(--surface-sunken); }
    .note-card.expanded { border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--surface); box-shadow: var(--shadow-card); }

    .note-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .note-card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
    }
    .collapse-icon {
      font-size: 10px;
      color: var(--ink-3);
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .note-card.expanded .collapse-icon { transform: rotate(90deg); color: var(--accent); }
    .note-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      padding-right: 72px;
    }

    .note-card-body-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s var(--ease-out);
    }
    .note-card.expanded .note-card-body-wrapper { grid-template-rows: 1fr; }
    .note-card-body-content { overflow: hidden; min-height: 0; }
    .note-card-content {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 12px 0;
    }
    .note-card-meta {
      font-size: 11px;
      color: var(--ink-3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      font-variant-numeric: tabular-nums;
    }

    .note-card-actions {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .note-card.expanded .note-card-actions { opacity: 1; pointer-events: auto; }

    .category-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .category-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-2);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }
    .category-chip:hover { border-color: var(--line-strong); color: var(--ink); }
    .category-chip.selected {
      background: var(--accent-tint);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--accent-ink);
    }

    .title-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-input-wrapper .input-field { margin-bottom: 0; }

    .btn-add-custom-cat {
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      color: var(--ink-2);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--transition);
    }
    .btn-add-custom-cat:hover {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: var(--accent-tint);
    }

    .textarea-field {
      height: 160px;
      resize: none;
      width: 100%;
      margin-bottom: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="liff-container">
    <!-- User identity Badge at the very top -->
    <div class="user-badge" id="user-badge" style="display: none;">
      <img class="user-avatar" id="user-avatar" src="" alt="avatar">
      <span id="user-name">載入同仁資料中...</span>
    </div>

    <!-- Header Section -->
    <div class="header">
      <div class="header-icon">📋</div>
      <h1>注意事項管理目錄</h1>
      <p>可透過篩選器過濾類別，點擊卡片編輯或刪除</p>
      <div class="meta-info" id="meta-info">
        連線中...
      </div>
    </div>

    <!-- Directory Header & Add Button -->
    <div class="directory-header">
      <span style="font-size: 14px; font-weight: 600; color: var(--text-secondary);">公告項目列表</span>
      <button class="btn-add" onclick="openAddModal()">
        <span>＋</span> 新增公告項目
      </button>
    </div>

    <details id="note-reviews" class="review-panel">
      <summary id="review-summary">待確認公告</summary>
      <p>疑似重複的辨識結果保留 7 天，逾期自動清除。補建使用原文字，不需重新辨識。</p>
      <div id="review-list" aria-live="polite">讀取中…</div>
    </details>

    <!-- Horizontal Category Filter Bar -->
    <div class="filter-bar" id="filter-bar">
      <!-- Generated dynamically -->
      <button class="filter-btn active" id="filter-all" onclick="filterNotes('ALL')">全部</button>
    </div>

    <!-- Notice Items List Container -->
    <div class="notes-list" id="notes-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
        正在載入病房注意事項...
      </div>
    </div>

    <!-- Close LIFF Window Button -->
    <button class="btn-secondary" style="width: 100%; padding: 12px;" onclick="closeLiff()">
      ✕ 關閉視窗
    </button>
  </div>

  <!-- Add/Edit Notice Modal Overlay -->
  <div class="modal-overlay" id="note-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title-text">
        <span>✏️</span> 編輯公告項目
      </div>
      
      <div class="form-group" style="margin-bottom: 12px;">
        <label class="form-label">選擇快捷標題類別</label>
        <div class="category-selector" id="modal-category-selector">
          <!-- Chips generated dynamically -->
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">公告標題 (可手動修改或點選快捷選單)</label>
        <div class="title-input-wrapper">
          <input type="text" class="input-field" id="input-title" placeholder="例如：會診、藥物、手術、檢查" oninput="checkCustomTitle()">
          <button class="btn-add-custom-cat" id="btn-save-cat" style="display: none;" onclick="addNewCategoryFromInput()" title="將此自訂標題加入快捷選單">
            ＋ 新增至選單
          </button>
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">公告內容</label>
        <textarea class="input-field textarea-field" id="input-content" placeholder="請直接輸入注意事項內容，同仁可一目了然..."></textarea>
      </div>
      
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save-confirm" id="btn-save-confirm" onclick="saveNoteSubmit()">確認儲存</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast-notify">
    <div class="toast-icon" id="toast-icon"></div>
    <span id="toast-text">更新成功！</span>
  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let userName = '未知同仁';
    let userAvatarUrl = '';
    let currentEditId = null; 
    let allNotes = []; // Stores all fetched notes locally to perform client-side filtering
    let currentFilter = 'ALL';
    let expandedNoteIds = new Set();
    
    // Category list persistence in localStorage
    const defaultCategories = ['會診', '藥物', '手術', '檢查', '其他'];
    let categories = JSON.parse(localStorage.getItem('note_categories')) || defaultCategories;

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast-notify');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');
      
      text.innerText = message;
      if (isError) {
        icon.className = 'toast-icon error';
      } else {
        icon.className = 'toast-icon';
      }
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Render Filter Bar and Modal Title Buttons
    function renderCategoryUI() {
      // 1. Render Main Directory Filter Bar
      const filterBar = document.getElementById('filter-bar');
      filterBar.innerHTML = `<button class="filter-btn ${currentFilter === 'ALL' ? 'active' : ''}" id="filter-all" onclick="filterNotes('ALL')">全部</button>`;
      
      categories.forEach(cat => {
        const activeClass = currentFilter === cat ? 'active' : '';
        filterBar.insertAdjacentHTML('beforeend', `
          <button class="filter-btn ${activeClass}" onclick="filterNotes('${cat}')">${escapeHtml(cat)}</button>
        `);
      });
      
      // 2. Render Modal Categories Quick Select
      const modalSelector = document.getElementById('modal-category-selector');
      modalSelector.innerHTML = '';
      
      categories.forEach(cat => {
        modalSelector.insertAdjacentHTML('beforeend', `
          <button class="category-chip" id="chip-${cat}" onclick="selectCategoryChip('${cat}')">${escapeHtml(cat)}</button>
        `);
      });
    }

    function selectCategoryChip(cat) {
      // Unselect all other chips
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('selected'));
      
      // Select clicked chip
      const selectedChip = document.getElementById(`chip-${cat}`);
      if (selectedChip) selectedChip.classList.add('selected');
      
      // Set input value
      document.getElementById('input-title').value = cat;
      document.getElementById('btn-save-cat').style.display = 'none'; // Predefined, hide button
    }

    function checkCustomTitle() {
      const titleInput = document.getElementById('input-title').value.trim();
      const saveCatBtn = document.getElementById('btn-save-cat');
      
      // Highlight matching chip if it matches typed text
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('selected'));
      
      if (!titleInput) {
        saveCatBtn.style.display = 'none';
        return;
      }
      
      const matchedCat = categories.find(c => c === titleInput);
      if (matchedCat) {
        const matchedChip = document.getElementById(`chip-${matchedCat}`);
        if (matchedChip) matchedChip.classList.add('selected');
        saveCatBtn.style.display = 'none';
      } else {
        // It's a custom category! Display the "Add to quick menu" button
        saveCatBtn.style.display = 'block';
      }
    }

    function addNewCategoryFromInput() {
      const titleInput = document.getElementById('input-title').value.trim();
      if (titleInput && !categories.includes(titleInput)) {
        categories.push(titleInput);
        localStorage.setItem('note_categories', JSON.stringify(categories));
        renderCategoryUI();
        
        // Select newly added category
        selectCategoryChip(titleInput);
        showToast(`已將「${titleInput}」新增至快捷選單！`);
      }
    }

    // Modal Control
    function openAddModal() {
      currentEditId = null;
      document.getElementById('modal-title-text').innerHTML = '<span>＋</span> 新增公告項目';
      document.getElementById('input-title').value = '';
      document.getElementById('input-content').value = '';
      document.getElementById('btn-save-cat').style.display = 'none';
      
      // Unselect all chips
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('selected'));
      
      document.getElementById('note-modal').classList.add('show');
    }

    async function openEditModal(id) {
      currentEditId = id;
      document.getElementById('modal-title-text').innerHTML = '<span>✏️</span> 編輯公告項目';
      document.getElementById('btn-save-cat').style.display = 'none';
      
      // Fetch details from API
      try {
        const res = await fetch(`/api/notes/${id}`);
        if (res.ok) {
          const note = await res.json();
          document.getElementById('input-title').value = note.title;
          document.getElementById('input-content').value = note.content;
          
          // Select chip if title matches any category
          const chips = document.querySelectorAll('.category-chip');
          chips.forEach(c => c.classList.remove('selected'));
          
          const matchedCat = categories.find(c => c === note.title);
          if (matchedCat) {
            const matchedChip = document.getElementById(`chip-${matchedCat}`);
            if (matchedChip) matchedChip.classList.add('selected');
          }
          
          document.getElementById('note-modal').classList.add('show');
        } else {
          showToast('無法取得公告詳細內容', true);
        }
      } catch (error) {
        showToast('載入公告失敗：' + error.message, true);
      }
    }

    function closeModal() {
      document.getElementById('note-modal').classList.remove('show');
    }

    // Initialize LIFF
    async function initLiff() {
      renderCategoryUI();
      
      try {
        const resConfig = await fetch('/api/config');
        const config = await resConfig.json();
        
        await liff.init({ liffId: config.LIFF_NOTES_ID });

        if (liff.isLoggedIn()) window.__setIdToken(liff.getIDToken());
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userName = profile.displayName;
          userAvatarUrl = profile.pictureUrl;
          
          document.getElementById('user-name').innerText = userName;
          if (userAvatarUrl) {
            document.getElementById('user-avatar').src = userAvatarUrl;
          } else {
            document.getElementById('user-avatar').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2314b8a6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
          }
          document.getElementById('user-badge').style.display = 'flex';
          
          // Sync user profile
          await fetch('/api/users/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lineUserId: profile.userId, displayName: userName })
          });
        } else {
          console.warn("LINE LIFF not logged in. Running in standalone browser mode.");
          userName = "臨床測試人員";
          document.getElementById('user-name').innerText = userName;
          document.getElementById('user-avatar').src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2364748b"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
          document.getElementById('user-badge').style.display = 'flex';
        }

        await fetchNotesList();
      } catch (err) {
        console.error('LIFF initialization failed', err);
        document.getElementById('meta-info').innerText = '連線失敗，建議於 LINE 內打開。';
        await fetchNotesList(); 
      }
    }

    // Load Notices List
    async function fetchNotesList() {
      await fetchNoteReviews();
      try {
        const response = await fetch('/api/notes');
        if (response.ok) {
          allNotes = await response.json();
          renderNotesList();
        } else {
          document.getElementById('notes-list').innerHTML = '<div style="text-align: center; color: var(--color-rose); padding: 45px;">無法從伺服器取得資料</div>';
        }
      } catch (error) {
        document.getElementById('notes-list').innerHTML = '<div style="text-align: center; color: var(--color-rose); padding: 45px;">連線異常</div>';
        console.error(error);
      }
    }

    async function fetchNoteReviews() {
      const list = document.getElementById('review-list');
      try {
        const response = await fetch('/api/note-reviews', { cache: 'no-store' });
        if (!response.ok) throw new Error('暫時無法讀取，請重新開啟目錄。');
        const reviews = await response.json();
        document.getElementById('review-summary').textContent = `待確認公告（${reviews.length}）`;
        list.innerHTML = reviews.length ? reviews.map(item => `
          <article class="review-item">
            <h3>${escapeHtml(item.title)}</h3>
            <p class="review-countdown" data-expires="${escapeHtml(item.expires_at)}" role="timer"></p>
            <p class="review-content">${escapeHtml(item.content)}</p>
            <details><summary>比對既有公告：${escapeHtml(item.candidate_title || '原公告已刪除')}</summary>
              <p class="review-content">${escapeHtml(item.candidate_content || '可直接核對上方待確認內容。')}</p>
            </details>
            <div class="review-actions">
              <button class="btn-primary" onclick="resolveReview(${item.id}, 'approve', this)">補建公告</button>
              <button class="btn-secondary" onclick="resolveReview(${item.id}, 'dismiss', this)">確認重複，捨棄</button>
            </div>
          </article>`).join('') : '<p>目前沒有待確認公告。</p>';
        if (location.hash === '#note-reviews') document.getElementById('note-reviews').open = true;
        updateReviewCountdowns();
      } catch (error) {
        list.textContent = error.message;
      }
    }

    function updateReviewCountdowns() {
      document.querySelectorAll('.review-countdown').forEach(element => {
        const seconds = Math.max(0, Math.floor((Date.parse(element.dataset.expires) - Date.now()) / 1000));
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor(seconds % 86400 / 3600);
        element.textContent = !seconds ? '已到期，無法補建'
          : seconds < 3600 ? '剩餘不到 1 小時後自動清除'
          : `剩餘 ${days} 天 ${hours} 小時後自動清除`;
        element.title = `到期時間：${new Date(element.dataset.expires).toLocaleString('zh-TW', { hour12: false })}`;
        if (!seconds) element.closest('.review-item').querySelectorAll('button').forEach(button => button.disabled = true);
      });
    }
    setInterval(updateReviewCountdowns, 1000);

    async function resolveReview(id, action, button) {
      const buttons = button.closest('.review-actions').querySelectorAll('button');
      buttons.forEach(item => item.disabled = true);
      try {
        const response = await fetch(`/api/note-reviews/${id}/resolve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action })
        });
        if (!response.ok) throw new Error('處理失敗，資料仍保留，請稍後重試。');
        const result = await response.json();
        showToast(result.status === 'approved' ? '已補建公告，未重新辨識' : '已捨棄重複公告');
        await fetchNotesList();
      } catch (error) {
        showToast(error.message, true);
      } finally { buttons.forEach(item => item.disabled = false); }
    }

    // Client-side category filtering
    function filterNotes(category) {
      currentFilter = category;
      
      // Update Filter Bar Buttons
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => btn.classList.remove('active'));
      
      // Set active state on correct button
      const filterAll = document.getElementById('filter-all');
      if (category === 'ALL') {
        filterAll.classList.add('active');
      } else {
        // Find matching filter button and activate it
        const targetBtn = Array.from(filterBtns).find(btn => btn.innerText === category);
        if (targetBtn) targetBtn.classList.add('active');
      }
      
      renderNotesList();
    }

    // Render list based on local cache and current filter
    function renderNotesList() {
      const container = document.getElementById('notes-list');
      
      // Apply Filter
      let filtered = allNotes;
      if (currentFilter !== 'ALL') {
        if (currentFilter === '其他') {
          // '其他' shows notes whose title is either exactly '其他' OR doesn't match any of the other default predefined categories
          filtered = allNotes.filter(n => {
            const hasMatch = defaultCategories.slice(0, 4).some(cat => n.title.includes(cat)); // matches 會診, 藥物, 手術, 檢查
            return !hasMatch;
          });
        } else {
          // Regular filter: matches title content (contains or equals)
          filtered = allNotes.filter(n => n.title.includes(currentFilter));
        }
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--ink-3); padding: 40px;">目前尚無符合此篩選類別的公告。</div>';
        document.getElementById('meta-info').innerText = '尚無此類別內容';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(note => {
        const dateStr = new Date(note.updated_at).toLocaleString('zh-TW', { hour12: false });
        const isExpanded = expandedNoteIds.has(String(note.id));
        const cardClass = isExpanded ? 'note-card expanded' : 'note-card';
        
        const cardHtml = `
          <div class="${cardClass}" id="note-card-${note.id}" onclick="toggleNote('${note.id}')">
            <div class="note-card-header">
              <div class="note-card-title-group">
                <span class="collapse-icon">▶</span>
                <span class="note-card-title">${escapeHtml(note.title)}</span>
              </div>
            </div>
            <div class="note-card-body-wrapper">
              <div class="note-card-body-content">
                <div class="note-card-content">${escapeHtml(note.content)}</div>
                <div class="note-card-meta">
                  <span>👤 更新者：${escapeHtml(note.updated_by)}</span>
                  <span>🕒 更新時間：${dateStr}</span>
                </div>
              </div>
            </div>
            <div class="note-card-actions">
              <button class="action-btn" onclick="event.stopPropagation(); openEditModal('${note.id}')" title="編輯">✏️</button>
              <button class="action-btn delete-btn" onclick="event.stopPropagation(); deleteNote('${note.id}')" title="刪除">🗑️</button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
      
      document.getElementById('meta-info').innerText = `已顯示 ${filtered.length} 筆公告項目`;
    }

    function toggleNote(id) {
      const card = document.getElementById(`note-card-${id}`);
      if (!card) return;
      const strId = String(id);
      if (expandedNoteIds.has(strId)) {
        expandedNoteIds.delete(strId);
        card.classList.remove('expanded');
      } else {
        expandedNoteIds.add(strId);
        card.classList.add('expanded');
      }
    }

    // Create or Edit Submit
    async function saveNoteSubmit() {
      const title = document.getElementById('input-title').value.trim();
      const content = document.getElementById('input-content').value.trim();
      
      if (!title || !content) {
        showToast('請填寫標題與內容', true);
        return;
      }

      // If the user entered a custom title but did not click "+新增至選單", auto-save it to selection chips for convenience
      if (title && !categories.includes(title)) {
        categories.push(title);
        localStorage.setItem('note_categories', JSON.stringify(categories));
        renderCategoryUI();
      }

      const btn = document.getElementById('btn-save-confirm');
      btn.disabled = true;
      btn.innerText = '儲存中...';

      try {
        let response;
        if (currentEditId === null) {
          // CREATE (POST)
          response = await fetch('/api/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content, updatedBy: userName })
          });
        } else {
          // UPDATE (PUT)
          response = await fetch(`/api/notes/${currentEditId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content, updatedBy: userName })
          });
        }

        if (response.ok) {
          showToast(currentEditId === null ? '公告已成功新增！' : '公告已成功修改！');
          closeModal();
          await fetchNotesList();
        } else {
          showToast('伺服器處理錯誤', true);
        }
      } catch (error) {
        showToast('連線失敗：' + error.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = '確認儲存';
      }
    }

    // Delete notice
    async function deleteNote(id) {
      if (confirm('確定要永久刪除此項公告嗎？刪除後無法還原。')) {
        try {
          const response = await fetch(`/api/notes/${id}`, {
            method: 'DELETE'
          });
          if (response.ok) {
            expandedNoteIds.delete(String(id));
            showToast('公告已成功刪除！');
            await fetchNotesList();
          } else {
            showToast('無法刪除公告', true);
          }
        } catch (error) {
          showToast('連線失敗：' + error.message, true);
        }
      }
    }

    // Close LIFF
    function closeLiff() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        alert('請在 LINE 內點選以關閉網頁。');
      }
    }

    // Escaping helper to avoid XSS
    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onload = initLiff;
  </script>
</body>
</html>
